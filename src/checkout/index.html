<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script type="module" src="../js/checkout.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout">
        <h2>Review &amp; Place your Order</h2>

        <form name="checkout" id="checkoutForm">
          <fieldset>
            <legend>Shipping Address</legend>
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" required />

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" required />

            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required />

            <label for="city">City</label>
            <input type="text" id="city" name="city" required />

            <label for="state">State</label>
            <input type="text" id="state" name="state" required />

            <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" required />
          </fieldset>

          <fieldset>
            <legend>Payment Info</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" required />

            <label for="expiration">Expiration Date</label>
            <input type="text" id="expiration" name="expiration" required />

            <label for="code">Security Code</label>
            <input type="text" id="code" name="code" required />
          </fieldset>

          <section class="checkout-summary">
            <p>Subtotal: <span id="cartSubtotal"></span></p>
            <p>Tax: <span id="cartTax"></span></p>
            <p>Shipping: <span id="cartShipping"></span></p>
            <p>Order Total: <span id="cartTotal"></span></p>
          </section>

          <button type="submit">Checkout</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
